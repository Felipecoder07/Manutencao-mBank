{% extends "base.html" %}

{% block title %}List of mBank Clients{% endblock %}

{% block breadcrumbs_container %}
    <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'bank:clients_list' %}" aria-current="page">Clients</a></li>
        </ol>
    </nav>
{% endblock %}

{% block content %}
    <br><br>
    <div class="container">
    <div class="row">
    <h1>List of mBank Clients</h1>

    <ul>
        {% for client in object_list %}
            <li>
                <a href="{% url 'bank:clients_detail' client.id %}">{{ client.name }}</a>
            </li>
        {% endfor %}

    </ul>
    </div>
    </div>
{% endblock %}
